name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip (se foi enviado compactado)
        run: |
          if [ -f app-dieta.zip ]; then
            unzip -o -q app-dieta.zip -d /tmp/z
            cp -r /tmp/z/app-dieta/. .
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Usar o Android que já vem instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar o app (offline)
        run: bash scripts/prepare-web.sh

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B0D0C' --iconBackgroundColorDark '#0B0D0C' --splashBackgroundColor '#0B0D0C' --splashBackgroundColorDark '#0B0D0C'

      - name: Permissões, som e ícone da notificação
        env:
          APP_VERSION: "1.0.${{ github.run_number }}"
          APP_CODE: "${{ github.run_number }}"
        run: bash scripts/patch-android.sh

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Dieta-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Dieta-APK
          path: Dieta-*.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dieta 1.0.${{ github.run_number }}
          body: "Baixe o arquivo .apk abaixo pelo celular e instale."
          files: Dieta-*.apk
